openapi: 3.1.0
info:
  title: Tiny Ledger API
  version: 1.0.0
  description: |
    Single-account ledger supporting deposit, withdrawal, balance inquiry,
    and transaction history. Mutating endpoints accept an Idempotency-Key
    header (idempotency enforcement is a planned future enhancement).

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Transactions
    description: Deposit and withdrawal operations
  - name: Account
    description: Balance and history queries

paths:
  /api/v1/accounts/{accountId}/transactions/deposit:
    post:
      tags: [Transactions]
      operationId: deposit
      summary: Deposit funds into an account
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
            example:
              amount: 100.00
              description: "Salary payment"
      responses:
        '201':
          description: Transaction created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/accounts/{accountId}/transactions/withdraw:
    post:
      tags: [Transactions]
      operationId: withdraw
      summary: Withdraw funds from an account
      parameters:
        - $ref: '#/components/parameters/AccountId'
        - $ref: '#/components/parameters/TransactionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionRequest'
            example:
              amount: 50.00
              description: "Rent payment"
      responses:
        '201':
          description: Transaction created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/v1/accounts/{accountId}/balance:
    get:
      tags: [Account]
      operationId: getBalance
      summary: Retrieve the current balance for an account
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: Current balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'

  /api/v1/accounts/{accountId}/transactions:
    get:
      tags: [Account]
      operationId: getTransactionHistory
      summary: Retrieve full transaction history for an account
      parameters:
        - $ref: '#/components/parameters/AccountId'
      responses:
        '200':
          description: List of all transactions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TransactionResponse'

components:
  parameters:
    AccountId:
      name: accountId
      in: path
      required: true
      description: Unique identifier for the account (alphanumeric, hyphens allowed)
      schema:
        type: string
        minLength: 1
        maxLength: 64
        pattern: '^[a-zA-Z0-9_-]+$'
    TransactionId:
      name: Transaction-Id
      in: header
      required: true
      description: |
        Client-generated unique ID for this request (UUID recommended).
        Reserved for future exactly-once processing — currently accepted but not enforced.
      schema:
        type: string
        minLength: 8
        maxLength: 64

  schemas:
    TransactionRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: number
          exclusiveMinimum: 0
          description: Amount in USD (must be positive)
          example: 100.00
        description:
          type: string
          maxLength: 255
          description: Optional human-readable description
          example: "Salary payment"

    TransactionResponse:
      type: object
      required: [id, type, amount, balanceAfter, timestamp]
      properties:
        id:
          type: string
          format: uuid
          description: Unique transaction identifier
        type:
          type: string
          enum: [DEPOSIT, WITHDRAWAL]
          description: Transaction type
        amount:
          type: number
          description: Transaction amount
        balanceAfter:
          type: number
          description: Account balance after this transaction
        description:
          type: string
          description: Optional description
        timestamp:
          type: string
          format: date-time
          description: ISO-8601 timestamp of the transaction

    BalanceResponse:
      type: object
      required: [balance, currency]
      properties:
        balance:
          type: number
          description: Current account balance
        currency:
          type: string
          description: Currency code
          example: USD

    ProblemDetail:
      type: object
      description: RFC 7807 Problem Details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

  responses:
    BadRequest:
      description: Invalid request (validation failure or insufficient funds)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
